<section class="section" id="contact">
  <div class="contact">
    <div class="reveal">
      <span class="eyebrow">Contact</span>
      <h2 class="h-display" style="margin-top:1.1rem">Get in touch</h2>

      <dl style="margin:2.5rem 0 0">
        <div class="detail"><dt>Email</dt><dd><a href="mailto:trintigon@gmail.com">trintigon@gmail.com</a></dd></div>
        <div class="detail"><dt>Based</dt><dd>Washington, DC</dd></div>
        <div class="detail"><dt>Instagram</dt><dd><a href="https://instagram.com/eli.lang3" target="_blank" rel="noopener">@eli.lang3</a></dd></div>
        <div class="detail"><dt>Booking</dt><dd>2026 — open</dd></div>
      </dl>
    </div>

    <form class="form reveal" data-d="1" id="form">
      <div class="field">
        <input type="text" id="name" name="name" placeholder=" " required>
        <label for="name">Name</label>
      </div>
      <div class="field">
        <input type="email" id="email" name="email" placeholder=" " required>
        <label for="email">Email</label>
      </div>
      <div class="field">
        <textarea id="message" name="message" placeholder=" " required></textarea>
        <label for="message">Message</label>
      </div>
      <button class="btn" type="submit"><span>Send</span></button>
      <p class="form-note" id="note"></p>
    </form>
  </div>
</section>
