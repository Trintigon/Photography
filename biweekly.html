        <div class="entry__meta"><span class="entry__no">No. 04</span><span class="entry__prompt">Golden Hour</span></div>
        <figure class="tile entry__frame" tabindex="0">
          <span class="entry__shot">
            <img src="images/biweekly/golden-hour.jpg" alt="Low sun through an underpass throwing stripes of light on a concrete wall, with the photographer's own shadow, camera raised, inside the middle stripe" width="2000" height="1905" loading="lazy">
            <svg viewBox="0 0 91.93 100" class="mark tile__mark" aria-hidden="true"><use href="#mark"/></svg>
          </span>
          <figcaption><b>Bars of Light</b><p>I took this under an underpass when the sun was low and coming in from the side, so the light came through the gaps and laid stripes of warm light across the concrete wall. The repeating light and dark bars create pattern and rhythm, and my own shadow with the camera up lands inside the middle stripe, which makes it the point of emphasis. The golden color against the cool gray concrete creates contrast, and the long angled shadows on the ground only happen at this time of day. Instead of photographing the sunset itself, I wanted to show what golden hour light does to an ordinary wall.</p><p class="entry__exif">Nikon D7100 · 1/500 · f/4.5 · ISO 400</p></figcaption>
        </figure>
      </article>

      <article class="entry reveal" style="--ar:1.4993">
        <div class="entry__meta"><span class="entry__no">No. 03</span><span class="entry__prompt">Forgotten Places</span><span class="entry__date">18 October 2026</span></div>
        <figure class="tile entry__frame" tabindex="0">
          <span class="entry__shot">
            <img src="images/biweekly/forgotten-places.jpg" alt="A painted car parked against a mural, shrubs and tall weeds growing out of it" width="2000" height="1334" loading="lazy">
            <svg viewBox="0 0 91.93 100" class="mark tile__mark" aria-hidden="true"><use href="#mark"/></svg>
          </span>
          <figcaption><span>Kensington</span><b>Parked for Good</b><p>This car isn't going anywhere anymore. It's been painted over and turned into a planter, with plants growing out of the roof and trunk, which is what made it feel forgotten to me. I shot it from the side with the car across the middle of the frame and used layering: the chalk &quot;Kensington&quot; and leaf drawings on the street in the foreground, the car in the middle ground, and the fence, mural and &quot;For Lease&quot; sign in the background. The bright colors and hard natural light show every texture, and the empty storefront sign adds to the feeling that the whole spot was left behind.</p><p class="entry__exif">Nikon D7100 · 1/1000 · f/3.8 · ISO 100</p></figcaption>
        </figure>
      </article>

      <article class="entry reveal" style="--ar:1.4993">
        <div class="entry__meta"><span class="entry__no">No. 02</span><span class="entry__prompt">Drip</span><span class="entry__date">1 January 2025</span></div>
        <figure class="tile entry__frame" tabindex="0">
          <span class="entry__shot">
            <img src="images/biweekly/drip.jpg" alt="Raindrops on glass, thrown out of focus, a lit convenience-store sign behind them" width="2000" height="1334" loading="lazy">
            <svg viewBox="0 0 91.93 100" class="mark tile__mark" aria-hidden="true"><use href="#mark"/></svg>
          </span>
          <figcaption><b>7-Eleven Through the Rain</b><p>I took this through a rain-covered car window at night and focused past the glass onto the 7-Eleven sign, so every drip on the window turned into a soft circle of light. The drops become a pattern that covers the whole frame and gives it a bubbly texture, while the sign's stripes add diagonal lines and a little red, orange and green. I left the dark edge of the car on the left as a frame, so it feels like you're sitting inside looking out. The artificial light and low-key setting make the water the brightest part of the photo, which is how I wanted to show the word drip.</p><p class="entry__exif">Nikon D7100 · 1/800 · f/13 · ISO 10159</p></figcaption>
        </figure>
      </article>

      <article class="entry reveal" style="--ar:1.4993">
        <div class="entry__meta"><span class="entry__no">No. 01</span><span class="entry__prompt">Hot</span><span class="entry__date">2025</span></div>
        <figure class="tile entry__frame" tabindex="0">
          <span class="entry__shot">
            <img src="images/biweekly/hot.jpg" alt="A figure lit by a burning firework at night, smoke glowing orange around them" width="2000" height="1334" loading="lazy">
            <svg viewBox="0 0 91.93 100" class="mark tile__mark" aria-hidden="true"><use href="#mark"/></svg>
          </span>
          <figcaption><b>Red Air</b><p>I shot this with a 2.6 second exposure, so the firework's light had time to soak into the smoke and turn the whole cloud red. The warm reds and oranges against the black, low-key background create strong contrast, and the brightest spot, the white-hot core by his hands, becomes the emphasis. I kept the person on the left side and let the smoke take up the rest of the frame, which gives it movement and makes the glow feel like it's spreading out. The soft texture of the smoke and the sparks dripping toward the ground make the air itself look hot.</p><p class="entry__exif">Nikon D7100 · 2.6s · f/22 · ISO 4000</p></figcaption>
        </figure>
